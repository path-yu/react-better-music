<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="声屿：基于 React 与本地网易云 API 的音乐播放器，支持推荐歌单、每日推荐、MV、歌词、离线缓存与桌面端。"
    />
    <link rel="preconnect" href="https://p1.music.126.net" />
    <link rel="preconnect" href="https://p2.music.126.net" />
    <link rel="preconnect" href="https://p3.music.126.net" />
    <link rel="preconnect" href="https://p4.music.126.net" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>声屿</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('react-music-ui') || '{}')
        if (saved?.state?.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
