<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="声屿：基于 React 与本地网易云 API 的音乐播放器，支持推荐歌单、每日推荐、MV、歌词、离线缓存与桌面端。"
    />
    <link rel="preconnect" href="https://p1.music.126.net" />
    <link rel="preconnect" href="https://p2.music.126.net" />
    <link rel="preconnect" href="https://p3.music.126.net" />
    <link rel="preconnect" href="https://p4.music.126.net" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>声屿</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('react-music-ui') || '{}')
        if (saved?.state?.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
    <!--
      Painted before the JS/CSS bundle so the first frame is the app's surface
      rather than a white flash. React clears this container on mount.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f5f7;
      }
      html.dark,
      html.dark body {
        background: #0f0f12;
        color-scheme: dark;
      }
      #app {
        height: 100%;
      }
      .boot-shell {
        display: flex;
        height: 100%;
        min-height: 100dvh;
      }
      .boot-sidebar {
        width: 232px;
        flex: none;
        border-right: 1px solid rgba(0, 0, 0, 0.06);
        background: rgba(244, 244, 247, 0.72);
      }
      html.dark .boot-sidebar {
        border-right-color: rgba(255, 255, 255, 0.06);
        background: #1c1c1e;
      }
      .boot-main {
        flex: 1;
        min-width: 0;
        padding: 46px 32px 110px;
      }
      .boot-bar {
        width: 42%;
        height: 14px;
        border-radius: 7px;
        background: rgba(0, 0, 0, 0.055);
      }
      .boot-hero {
        margin-top: 22px;
        height: 220px;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.045);
      }
      .boot-row {
        display: flex;
        gap: 14px;
        margin-top: 22px;
      }
      .boot-card {
        flex: 1;
        aspect-ratio: 1;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.04);
      }
      html.dark .boot-bar,
      html.dark .boot-hero,
      html.dark .boot-card {
        background: rgba(255, 255, 255, 0.05);
      }
      @media (max-width: 767px) {
        .boot-sidebar {
          display: none;
        }
        .boot-main {
          padding: 24px 16px 100px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" aria-hidden="true">
        <aside class="boot-sidebar"></aside>
        <div class="boot-main">
          <div class="boot-bar"></div>
          <div class="boot-hero"></div>
          <div class="boot-row">
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
